name: Development Partner
description: The Development Partner Protocol

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Specific request for the development partner"
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened, labeled]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python Environment
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Development Partner Session
        uses: actions/github-script@v9
        env:
          REQUEST_INPUT: ${{ github.event.inputs.request }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('🤝 Development Partner Protocol Activated');
            console.log('Repository:', context.repo.owner + '/' + context.repo.repo);
            console.log('Event:', context.eventName);

            // Log the request if provided via workflow_dispatch
            const request = process.env.REQUEST_INPUT || '';
            if (request) {
              console.log('Request:', request);
            }

      - name: PR Review Assistant
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Auto-comment on PRs with development partner context
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '👋 Development Partner is reviewing this PR. Will provide feedback shortly.'
            });
