name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: uv sync --all-extras
      - name: Run tests with coverage
        run: uv run pytest -n auto -v --tb=short --cov=main --cov=models --cov=validation --cov=config --cov=display --cov=gh_client --cov=sync --cov=api_client --cov=cache --cov=fix_env --cov-report=term-missing --cov-report=xml
